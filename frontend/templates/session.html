<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Session | AI Coach</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


<!-- ==========================
        NAVBAR
=========================== -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a href="/"
           class="navbar-brand logo">

            🤖 AI Coach

        </a>

    </div>

</nav>


<!-- ==========================
      SESSION HEADER
=========================== -->

<section class="hero pt-5 pb-3">

    <div class="container">

        <span class="badge-ai">

            Session Configuration

        </span>

        <h1 class="mt-4">

            Configure Your

            <span class="gradient">

                AI Coaching Session

            </span>

        </h1>

        <p>

            Create a realistic customer support scenario
            before launching the AI coaching simulator.

        </p>

    </div>

</section>


<!-- ==========================
       SESSION FORM
=========================== -->

<div class="container mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="form-card fade-up">

                <h3 class="mb-4">

                    Amazon Customer Support Demo

                </h3>


                <!-- Error Message -->

                <div id="errorMessage"
                     class="alert alert-danger d-none"
                     role="alert">

                </div>


                <!-- Interaction Mode -->

                <div class="mb-4">

                    <label for="mode"
                           class="form-label">

                        Interaction Mode

                    </label>

                    <select id="mode"
                            class="form-select">

                        <option value="Simulator"
                                selected>

                            Simulator

                        </option>

                        <option value="Manual">

                            Manual

                        </option>

                        <option value="Replay">

                            Replay

                        </option>

                    </select>

                </div>


                <!-- Product -->

                <div class="mb-4">

                    <label for="product"
                           class="form-label">

                        Product

                    </label>

                    <input id="product"
                           class="form-control"
                           value="Amazon"
                           placeholder="Enter product name">

                </div>


                <!-- Scenario -->

                <div class="mb-4">

                    <label for="scenario"
                           class="form-label">

                        Scenario

                    </label>

                    <select id="scenario"
                            class="form-select">

                        <option value="Return Request"
                                selected>

                            Return Request

                        </option>

                        <option value="Refund Delay">

                            Refund Delay

                        </option>

                        <option value="Damaged Product">

                            Damaged Product

                        </option>

                        <option value="Late Delivery">

                            Late Delivery

                        </option>

                        <option value="Wrong Product">

                            Wrong Product

                        </option>

                        <option value="General Support">

                            General Support

                        </option>

                    </select>

                </div>
                                <!-- Customer Persona -->

                <div class="mb-4">

                    <label for="persona"
                           class="form-label">

                        Customer Persona

                    </label>

                    <select id="persona"
                            class="form-select">

                        <option value="Calm">

                            Calm

                        </option>

                        <option value="Angry">

                            Angry

                        </option>

                        <option value="Confused">

                            Confused

                        </option>

                        <option value="Frustrated"
                                selected>

                            Frustrated

                        </option>

                    </select>

                </div>


                <!-- Difficulty & Language -->

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label for="difficulty"
                               class="form-label">

                            Difficulty

                        </label>

                        <select id="difficulty"
                                class="form-select">

                            <option value="Easy">

                                Easy

                            </option>

                            <option value="Medium"
                                    selected>

                                Medium

                            </option>

                            <option value="Hard">

                                Hard

                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-4">

                        <label for="language"
                               class="form-label">

                            Language

                        </label>

                        <select id="language"
                                class="form-select">

                            <option value="English"
                                    selected>

                                English

                            </option>

                            <option value="Hindi">

                                Hindi

                            </option>

                            <option value="Telugu">

                                Telugu

                            </option>

                        </select>

                    </div>

                </div>


                <!-- Start Button -->

                <button id="startButton"
                        type="button"
                        onclick="createSession()"
                        class="btn btn-primary-custom w-100">

                    <span id="buttonText">

                        🚀 Start AI Coaching Session

                    </span>

                    <span id="buttonLoader"
                          class="spinner-border spinner-border-sm ms-2 d-none"
                          role="status"
                          aria-hidden="true">

                    </span>

                </button>

            </div>

        </div>

    </div>

</div>


<footer class="footer">

    <div class="container">

        <p>

            AI Customer Support Coaching Assistant

        </p>

        <p>

            Infosys Internship Project • Vidzai Digital

        </p>

    </div>

</footer>


<script>
    async function createSession() {

    const startButton =
        document.getElementById("startButton");

    const buttonText =
        document.getElementById("buttonText");

    const buttonLoader =
        document.getElementById("buttonLoader");

    const errorMessage =
        document.getElementById("errorMessage");


    errorMessage.classList.add("d-none");

    errorMessage.textContent = "";


    const product =
        document.getElementById("product")
        .value
        .trim();


    const scenario =
        document.getElementById("scenario")
        .value;


    const persona =
        document.getElementById("persona")
        .value;


    const difficulty =
        document.getElementById("difficulty")
        .value;


    const language =
        document.getElementById("language")
        .value;


    const interactionMode =
        document.getElementById("mode")
        .value;


    if (!product) {

        showError(
            "Please enter a product name."
        );

        return;
    }


    const sessionData = {

        interaction_mode:
            interactionMode,

        product:
            product,

        scenario:
            scenario,

        customer_persona:
            persona,

        difficulty:
            difficulty,

        language:
            language

    };


    startButton.disabled = true;

    buttonText.textContent =
        "Creating Session...";

    buttonLoader.classList.remove(
        "d-none"
    );


    try {

        const response =
            await fetch(
                "/create-session",
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            sessionData
                        )
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            result.status !== "success"
        ) {

            throw new Error(

                result.message ||
                "Session creation failed."

            );
        }


        sessionStorage.setItem(

            "session_id",

            result.session_id

        );


        sessionStorage.setItem(

            "current_customer_message",

            result.customer_message

        );


        sessionStorage.setItem(

            "session_data",

            JSON.stringify(
                result.session
            )

        );


        sessionStorage.setItem(

            "interaction_mode",

            interactionMode

        );


        window.location.href =
            "/simulator";


    } catch (error) {

        showError(

            error.message ||

            "Unable to create the session. Please try again."

        );


        startButton.disabled = false;


        buttonText.textContent =

            "🚀 Start AI Coaching Session";


        buttonLoader.classList.add(

            "d-none"

        );
    }
}


function showError(message) {

    const errorMessage =

        document.getElementById(
            "errorMessage"
        );


    errorMessage.textContent =
        message;


    errorMessage.classList.remove(

        "d-none"

    );
}


document.addEventListener(

    "keydown",

    function(event) {

        if (event.key === "Enter") {

            createSession();

        }
    }
);
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
